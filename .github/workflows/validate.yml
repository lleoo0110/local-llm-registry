name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema pytest
      - run: check-jsonschema --schemafile registry/local-models.schema.json registry/local-models.json
      - run: check-jsonschema --schemafile releases.schema.json releases.json
      - run: python -m json.tool registry/watch.json > /dev/null
      - run: pytest -q
